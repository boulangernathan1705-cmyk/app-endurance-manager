name: probe-sources
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL "https://guide.lemansultimate.com/api/v2/help_center/articles/search.json?query=fair%20share" | python3 -c "import sys,json,re,html;d=json.load(sys.stdin);[print('#',a['title'],a['html_url'],'\n',re.sub(r'\n\s*\n+','\n',html.unescape(re.sub(r'<[^>]+>','\n',a['body'])))[:5000]) for a in d.get('results',[])[:3]]"
          B="https://docs.google.com/spreadsheets/d/e/2PACX-1vTN03UvJDm99byA6vQPZHKOCYVvfxLu1zkJAzdaKyROykzEKY2-Xl1rl1q5znZEf36m88dxMKsY2eaO/pub?single=true&output=csv&gid="
          echo ===== FUEL; curl -sL "${B}5654949" | head -45
          echo ===== DATA AVAIL; curl -sL "${B}1121282882" | head -12
          echo ===== GT3 CAR; curl -sL "${B}1991956603" | head -20
          echo ===== GROUPS; curl -sL "${B}840082924" | head -20
          echo ===== CALC; curl -sL "${B}1888591831" | head -30

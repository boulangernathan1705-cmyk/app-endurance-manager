name: Apply crew assignment category lock
on:
  push:
    branches: [fix/lock-categories-after-crew-assignment]
    paths:
      - .github/workflows/apply-lock-categories-after-assignment.yml
      - scripts/apply-lock-categories-after-assignment.mjs
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lock-categories-after-crew-assignment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-lock-categories-after-assignment.mjs
      - run: npm run check
      - name: Commit patch and remove temporary automation
        run: |
          rm scripts/apply-lock-categories-after-assignment.mjs
          rm .github/workflows/apply-lock-categories-after-assignment.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: remove extra categories after crew assignment"
          git push origin HEAD:fix/lock-categories-after-crew-assignment

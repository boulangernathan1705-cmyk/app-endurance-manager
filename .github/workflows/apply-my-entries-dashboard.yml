name: Apply my entries dashboard
on:
  push:
    branches: [feature/my-entries-dashboard]
    paths: ['.github/workflows/apply-my-entries-dashboard.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/my-entries-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply changes
        run: python3 scripts/apply-my-entries-dashboard.py
      - name: Run checks
        run: npm run check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles/application.css index.html
          git commit -m "feat: redesign my entries as pilot dashboard"
          git push

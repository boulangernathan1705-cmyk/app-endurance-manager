name: Archive then remove 18 reviewed branches (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview or create recovery tags and delete exactly the 18 reviewed branches"
        required: true
        type: choice
        default: preview
        options: [preview, delete]
      confirmation:
        description: "Delete mode requires ARCHIVE_AND_DELETE_18_BRANCHES"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: final-reviewed-branch-archival
  cancel-in-progress: false

jobs:
  archive-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Save immutable commit references before deleting reviewed branches
        uses: actions/github-script@v7
        env:
          CLEANUP_MODE: ${{ inputs.mode }}
          CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            // Audited 30 October 2026. Exact names and commit IDs, no discovery-based deletion.
            const candidates = [
              ['bandeau-15-min', 'ab398bff2bf0eac19e5d33a6bd0f6785914572bb'],
              ['carte-fluide', '8aff33d5970c639625c7eb6f38d61c7535c84c56'],
              ['claude/corrections-pc', 'fd881131fb23454f8b16c5a482af420c48cd35e6'],
              ['claude/infos-course-priorite', 'dd051ccc3e374cd7bc57009f19a04955aea2976e'],
              ['claude/installation-facile', 'fee83bd30bee5e76f4904676a2b10840e194114c'],
              ['claude/plugin-pilote-simple', '99ed1f02e300071759e9c77f204796e1ae063f23'],
              ['claude/project-thread-gplawv', 'bf87acd62a5a604c60a8efd13c1916301c8ea4ee'],
              ['claude/project-thread-ngamf6', '44a4d38035946489839a55801211d16537ef4fb6'],
              ['claude/project-thread-p5tm5e', 'bcf562e0d8741198abaa50967c184e2842fc9892'],
              ['feature/discord-course-spaces', '49fcc1470cea5566a5408de75ff7684181234966'],
              ['feature/official-discord-setup', '1a471ea7a210b568e3d6bcd926d6b0b4e843f47e'],
              ['fiche-pilote', 'c79bb2e98a803062fc6ae81b0f6d5e3c293f83cd'],
              ['fix/desktop-departure-actions-row', '94034c666b2ae7631bb1423ff91a25f848db351e'],
              ['fix/discord-shared-round-details', '8ff1d580c8b19cbefa03d14df07d3c1a2e96efc3'],
              ['fix/safe-historical-branch-cleanup-20261030', '685469d6dee852c4f7eb6ac5929e2c87b422903e'],
              ['hotfix/discord-voices-weekly', '387eb672ef8d83a1ca94b6d1e48b1a8035308f61'],
              ['overlay-essais', 'f23926445e4821df0aedce29165fa30959b93e0e'],
              ['release/pilot-count-main', '5129ab0bd0a3e760e2ca0e0d4bb3e8e989670dbe'],
            ];
            const mode = process.env.CLEANUP_MODE || 'preview';
            if (!['preview','delete'].includes(mode)) throw Error('Invalid mode');
            if (mode === 'delete' && process.env.CLEANUP_CONFIRMATION !== 'ARCHIVE_AND_DELETE_18_BRANCHES') {
              throw Error('Deletion requires exactly ARCHIVE_AND_DELETE_18_BRANCHES');
            }
            const {owner,repo}=context.repo;
            const protectedNames=new Set(['main','dev','suite-modules','claude/project-thread-ogkwfr']);
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            let ready=0, archived=0, deleted=0, skipped=0;
            const report=[];
            for (const [branch,expectedSha] of candidates) {
              if (protectedNames.has(branch) || branch.startsWith('archive/') ||
                  open.some(p=>p.head.ref===branch && p.head.repo?.full_name===`${owner}/${repo}`)) {
                report.push([branch,'SKIPPED: protected or active PR']);skipped++;continue;
              }
              let current;
              try {
                current=(await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`})).data;
              } catch(e) {
                if (e.status===404){report.push([branch,'SKIPPED: absent']);skipped++;continue;}
                throw e;
              }
              if (current.object.sha!==expectedSha){
                report.push([branch,'SKIPPED: commit changed']);skipped++;continue;
              }
              const tagName='branch-backups/2026-10-30/'+branch.replaceAll('/','--')+'-'+expectedSha.slice(0,12);
              const tagRef=`tags/${tagName}`;
              ready++;
              if (mode==='preview') {
                report.push([branch,`PREVIEW: backup tag ${tagName}`]);continue;
              }
              // Create a durable lightweight tag before any deletion. Never modify existing tags.
              try {
                await github.rest.git.createRef({owner,repo,ref:`refs/${tagRef}`,sha:expectedSha});
                archived++;
              } catch(e) {
                if (e.status!==422) throw e;
                // Existing tags are only acceptable if they point to exactly this commit.
              }
              const backup=(await github.rest.git.getRef({owner,repo,ref:tagRef})).data;
              if (backup.object.type!=='commit' || backup.object.sha!==expectedSha) {
                throw Error(`Backup tag verification failed for ${branch}. No deletion.`);
              }
              // Recheck branch head and open PR immediately before deleting.
              const freshOpen=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',head:`${owner}:${branch}`,per_page:100});
              if (freshOpen.length){report.push([branch,'SKIPPED: new PR']);skipped++;continue;}
              const fresh=(await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`})).data;
              if(fresh.object.sha!==expectedSha){report.push([branch,'SKIPPED: commit moved']);skipped++;continue;}
              await github.rest.git.deleteRef({owner,repo,ref:`heads/${branch}`});
              deleted++;
              report.push([branch,`DELETED; recover from refs/${tagRef}`]);
              core.notice(`Archived and deleted ${branch}: ${tagName}`);
            }
            core.summary.addHeading('Final reviewed branch cleanup');
            core.summary.addRaw(`Mode: **${mode}**; eligible: **${ready}**; tags newly created: **${archived}**; deleted: **${deleted}**; skipped: **${skipped}**.\n\n`);
            core.summary.addTable([[{data:'Branch',header:true},{data:'Result',header:true}],...report]);
            core.summary.addRaw('\nBackups are Git tags under `branch-backups/2026-10-30/`. Do not delete these tags until no recovery is necessary.');
            await core.summary.write();

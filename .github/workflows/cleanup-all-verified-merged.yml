name: Global safe cleanup of merged PR branches (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview all eligible branches, or delete verified merged PR heads"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - delete
      confirmation:
        description: "For delete mode enter DELETE_ALL_VERIFIED_MERGED_BRANCHES"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: manual-global-branch-cleanup
  cancel-in-progress: false

jobs:
  review-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory every branch and delete only verified merged PR heads
        uses: actions/github-script@v7
        env:
          CLEANUP_MODE: ${{ inputs.mode }}
          CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const mode = process.env.CLEANUP_MODE || 'preview';
            if (!['preview','delete'].includes(mode)) throw Error('Invalid mode');
            if (mode === 'delete' && process.env.CLEANUP_CONFIRMATION !== 'DELETE_ALL_VERIFIED_MERGED_BRANCHES') {
              throw Error('Deletion requires exact confirmation DELETE_ALL_VERIFIED_MERGED_BRANCHES');
            }
            const {owner,repo} = context.repo;
            const fullName = `${owner}/${repo}`;
            // All named projects are in scope IF their exact head is already in a merged PR.
            // Unmerged work is never removed, even if it is old or named like an experiment.
            // Keep stable refs, archives and the two active PR branches unconditionally.
            const protectedNames = new Set([
              'main', 'dev', 'suite-modules', 'claude/project-thread-ogkwfr'
            ]);
            function protectedBranch(name) {
              return protectedNames.has(name) || name.startsWith('archive/');
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,repo,state:'all',per_page:100,sort:'updated',direction:'desc'
            });
            const open = pulls.filter(p => p.state === 'open' && p.head.repo?.full_name === fullName);
            const mergedHeads = new Map();
            for (const pr of pulls) {
              if (!pr.merged_at || !['main','dev'].includes(pr.base.ref)) continue;
              if (pr.head.repo?.full_name !== fullName) continue;
              const name = pr.head.ref;
              if (!mergedHeads.has(name)) mergedHeads.set(name, new Map());
              mergedHeads.get(name).set(pr.head.sha, pr.number);
            }
            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner,repo,ref:'heads/',per_page:100
            });
            const available = refs.map(r => ({name:r.ref.replace(/^refs\/heads\//,''),sha:r.object.sha}));
            const eligible = [], skipped = [];
            for (const ref of available) {
              const name = ref.name;
              if (protectedBranch(name)) {
                skipped.push([name,'protected project or stable branch']); continue;
              }
              if (open.some(p => p.head.ref === name)) {
                skipped.push([name,'open pull request']);continue;
              }
              const prNumber = mergedHeads.get(name)?.get(ref.sha);
              if (!prNumber) {
                skipped.push([name,'no exact matching merged PR head']);continue;
              }
              eligible.push({name,sha:ref.sha,prNumber});
            }
            // Deterministic, complete inventory before the first deletion.
            eligible.sort((a,b)=>a.name.localeCompare(b.name));
            core.info(`Found ${available.length} current branches, ${eligible.length} eligible, ${skipped.length} excluded`);
            core.summary.addHeading('Global merged-branch cleanup');
            core.summary.addRaw(`Mode: **${mode}**. Branches: **${available.length}**; eligible: **${eligible.length}**; protected/unverified: **${skipped.length}**.\n\n`);
            core.summary.addHeading('Eligible branches');
            core.summary.addTable([
              [{data:'Branch',header:true},{data:'Merged PR',header:true}],
              ...eligible.map(x => [x.name,`#${x.prNumber}`])
            ]);
            core.summary.addHeading('Excluded branches');
            core.summary.addTable([
              [{data:'Branch',header:true},{data:'Reason',header:true}],
              ...skipped.map(x=>x)
            ]);
            let deleted=0, changed=0;
            if (mode === 'delete') {
              for (const entry of eligible) {
                const stillOpen = await github.paginate(github.rest.pulls.list, {
                  owner,repo,state:'open',per_page:100,head:`${owner}:${entry.name}`
                });
                if (stillOpen.length) {
                  core.warning(`SKIP ${entry.name}: PR reopened/created`);changed++;continue;
                }
                const pr = (await github.rest.pulls.get({owner,repo,pull_number:entry.prNumber})).data;
                if (!pr.merged_at || !['dev','main'].includes(pr.base.ref) ||
                    pr.head.ref!==entry.name || pr.head.sha!==entry.sha ||
                    pr.head.repo?.full_name!==fullName) {
                  core.warning(`SKIP ${entry.name}: PR evidence changed`);changed++;continue;
                }
                const current = (await github.rest.git.getRef({owner,repo,ref:`heads/${entry.name}`})).data;
                if (current.object.sha !== entry.sha || protectedBranch(entry.name)) {
                  core.warning(`SKIP ${entry.name}: SHA moved or protected`);changed++;continue;
                }
                await github.rest.git.deleteRef({owner,repo,ref:`heads/${entry.name}`});
                deleted++;
                core.notice(`DELETED ${entry.name} (PR #${entry.prNumber})`);
              }
            }
            core.summary.addHeading('Result');
            core.summary.addRaw(`Deleted: **${deleted}**; skipped after final re-check: **${changed}**.\n`);
            await core.summary.write();

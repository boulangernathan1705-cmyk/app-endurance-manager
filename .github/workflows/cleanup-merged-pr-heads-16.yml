name: Clean 16 merged PR head branches (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview eligible branches or delete after confirmation
        required: true
        type: choice
        default: preview
        options: [preview, delete]
      confirmation:
        description: "For delete mode, enter DELETE_16_MERGED_BRANCHES"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact merged PR commits and clean only allowed branches
        uses: actions/github-script@v7
        env:
          CLEANUP_MODE: ${{ inputs.mode }}
          CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            // Each triplet was verified against a merged PR (head SHA matches branch head).
            // The workflow does not discover, glob or clean any other branches.
            const candidates = [
              ['feature/memo-v2', 399, '82e852e2a56d75528d7ff7bd11c7a77333add5fa'],
              ['codex/memo-collection-cycle', 220, '0184b20529d5660ecbf2616a4e8272435f82e782'],
              ['codex/training-mockup', 218, '30ee11200f3f9e728affcf3ed4de722035975649'],
              ['feature/discord-daily-detailed-layout', 590, 'ad9827422f56b820e34bc28c15bce1a4ec6c290a'],
              ['feature/tdz-rally-real-comparison', 592, '8a4325d182147a1e86788ffa77ab90e089221274'],
              ['claude/memo-barre', 214, 'aa012a991fb725236ef3f27f21f8d5e1b24da5be'],
              ['claude/memo-circuit', 204, '11fb140959e2500da4a5a7581630360f910d28cb'],
              ['claude/mur-des-stands-corrections-bfkugo', 430, 'fe1d2a8c3780056f89c6e4a844281caae9256906'],
              ['codex/endurance-training-checklist', 221, '541fca5d2655875a2844a4ed6bfa2957a8413461'],
              ['codex/pit-training-usability', 219, '9d5647b57c38f63c7322b054eb9b0ffdc4f98cdc'],
              ['feature/notifications-site', 181, 'ed1ae4630a938642165a3ad5584e0de96b587875'],
              ['feature/iracing-solo-endurance-import', 391, '9992314d85684677d53179c01ce61735ca59d45f'],
              ['fix/mobile-circuit-card-bounds', 394, 'bd260445aca8d7a40c3809abdc4097905fe7cbf1'],
              ['fix/sitewide-filter-consistency', 392, '8e79c64074dcea4c16e87cc7896a2e857a9348db'],
              ['hotfix/stream-announcements-v1.97', 585, 'db7f3486d71d4915918c10cd5a33f4f1cbc67d8e'],
              ['fix/revue-securite', 179, '5a8b157c17552008fda08d66f514283c795ac6ba'],
            ];
            const mode = process.env.CLEANUP_MODE || 'preview';
            if (!['preview','delete'].includes(mode)) {
              core.setFailed('Unsupported mode');
              return;
            }
            if (mode === 'delete' && process.env.CLEANUP_CONFIRMATION !== 'DELETE_16_MERGED_BRANCHES') {
              core.setFailed('Deletion requires exactly DELETE_16_MERGED_BRANCHES');
              return;
            }
            const {owner,repo} = context.repo;
            const open = await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            let eligible = 0, deleted = 0, skipped = 0;
            for (const [branch,prNumber,expectedSha] of candidates) {
              try {
                if (!/^(?:feature|fix|hotfix|claude|codex)\//.test(branch) ||
                    open.some(pr => pr.head.ref === branch && pr.head.repo?.full_name === `${owner}/${repo}`)) {
                  core.warning(`SKIP ${branch}: prohibited prefix or open PR`); skipped++; continue;
                }
                const pr = (await github.rest.pulls.get({owner,repo,pull_number:prNumber})).data;
                if (!pr.merged_at || pr.base.ref !== 'dev' && pr.base.ref !== 'main' ||
                    pr.head.ref !== branch || pr.head.sha !== expectedSha) {
                  core.warning(`SKIP ${branch}: matching PR was not merged at the expected head`); skipped++; continue;
                }
                let current;
                try {
                  current = (await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`})).data;
                } catch(e) {
                  if (e.status === 404) {core.info(`SKIP ${branch}: already absent`); skipped++; continue;}
                  throw e;
                }
                if (current.object.sha !== expectedSha) {
                  core.warning(`SKIP ${branch}: branch head changed`); skipped++; continue;
                }
                eligible++;
                if (mode === 'preview') {core.notice(`PREVIEW eligible: ${branch} (PR #${prNumber})`);continue;}
                // If the ref moved after inspection, do not delete.
                const last = (await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`})).data;
                if (last.object.sha !== expectedSha) {core.warning(`SKIP ${branch}: SHA changed`);skipped++;continue;}
                await github.rest.git.deleteRef({owner,repo,ref:`heads/${branch}`});
                deleted++;
                core.notice(`DELETED: ${branch}`);
              } catch(e) {
                core.error(`Branch ${branch}: ${e.message}`);
                throw e;
              }
            }
            core.summary.addHeading('Historical merged PR branch cleanup');
            core.summary.addRaw(`Mode: ${mode}; eligible: ${eligible}; deleted: ${deleted}; skipped: ${skipped}`);
            await core.summary.write();

name: Apply header layout refresh
on:
  push:
    branches:
      - refine/header-nav-banner-quality
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/header-nav-banner-quality
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply layout changes
        run: node scripts/apply-header-layout-refresh.mjs
      - name: Improve banner quality for wide displays
        run: |
          ffmpeg -y -i images/endurance-manager-banner.webp -vf "scale=4344:1448:flags=lanczos,unsharp=5:5:0.55:5:5:0" -frames:v 1 -c:v libwebp -quality 92 images/endurance-manager-banner-hq.webp
          mv images/endurance-manager-banner-hq.webp images/endurance-manager-banner.webp
      - name: Run checks
        run: npm run check
      - name: Commit final changes and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles/fmt-racing-theme.css images/endurance-manager-banner.webp
          git rm scripts/apply-header-layout-refresh.mjs .github/workflows/apply-header-layout-refresh.yml
          git commit -m "refine: sharpen banner and move navigation below header"
          git push origin HEAD:refine/header-nav-banner-quality

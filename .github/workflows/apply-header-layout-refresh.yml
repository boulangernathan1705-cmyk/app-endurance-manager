name: Apply header layout refresh
on:
  push:
    branches:
      - refine/header-nav-banner-quality
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/header-nav-banner-quality
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply layout changes
        run: node scripts/apply-header-layout-refresh.mjs
      - name: Improve banner quality for wide displays
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageFilter
          path='images/endurance-manager-banner.webp'
          image=Image.open(path).convert('RGB')
          image=image.resize((4344,1448),Image.Resampling.LANCZOS)
          image=image.filter(ImageFilter.UnsharpMask(radius=1.0,percent=115,threshold=3))
          image.save(path,'WEBP',quality=92,method=6)
          print('banner',image.size)
          PY
      - name: Run checks
        run: npm run check
      - name: Commit final changes and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles/fmt-racing-theme.css images/endurance-manager-banner.webp
          git rm scripts/apply-header-layout-refresh.mjs .github/workflows/apply-header-layout-refresh.yml
          git commit -m "refine: sharpen banner and move navigation below header"
          git push origin HEAD:refine/header-nav-banner-quality

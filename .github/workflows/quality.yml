name: Quality checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, 'refactor/**', 'feature/**', 'fix/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm run check

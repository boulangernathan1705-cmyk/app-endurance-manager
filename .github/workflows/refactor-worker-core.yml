name: Apply worker core refactor

on:
  push:
    branches: ['refactor/codebase-cleanup']
    paths:
      - 'scripts/refactor-worker-core.mjs'
      - '.github/workflows/refactor-worker-core.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/codebase-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Extract worker core
        run: node scripts/refactor-worker-core.mjs
      - name: Run full checks
        run: npm run check
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract worker core from routes"
          git push origin HEAD:refactor/codebase-cleanup

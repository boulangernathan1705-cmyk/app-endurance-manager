name: Production release policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-policy:
    name: Release must come from dev
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as source branch
        shell: bash
        run: |
          # A hotfix/* branch made from main ships one fix alone while dev holds work still in test (Nathan, 2026-10-21).
          case "${{ github.head_ref }}" in
            dev) echo "Valid production release: dev -> main" ;;
            hotfix/*) echo "Valid production hotfix: ${{ github.head_ref }} -> main" ;;
            *) echo "Production releases must be merged from the dev branch (or a hotfix/* branch made from main)."
               echo "Open the pull request as: dev -> main."
               exit 1 ;;
          esac

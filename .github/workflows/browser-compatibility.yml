name: Browser compatibility

on:
  workflow_dispatch:
  push:
    branches: [dev]

concurrency:
  group: browser-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPAT_BASE_URL: https://app.endurance-manager.workers.dev
      ENV_LABEL: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Wait for deployment
        run: |
          echo "Checking ${ENV_LABEL}: ${COMPAT_BASE_URL}"
          expected="$(sha256sum app.js | awk '{print $1}')"
          for i in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 "${COMPAT_BASE_URL}/app.js" -o /tmp/deployed-app.js; then
              actual="$(sha256sum /tmp/deployed-app.js | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                echo "Exact commit assets are deployed."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "The deployed app.js never matched this commit."
          exit 1
      - run: npm run compat:test
        env:
          COMPAT_BASE_URL: ${{ env.COMPAT_BASE_URL }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-compatibility-report-${{ github.ref_name }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

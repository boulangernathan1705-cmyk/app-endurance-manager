name: Browser compatibility

on:
  workflow_dispatch:
  push:
    branches: [dev]

concurrency:
  group: browser-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPAT_BASE_URL: http://127.0.0.1:8788
      COMPAT_REMOTE_BASE_URL: https://app.endurance-manager.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install --no-audit --no-fund
      - name: Build exact commit for browser tests
        run: npm run build:workers
      - name: Start local browser-test server
        run: |
          python3 -m http.server 8788 --bind 127.0.0.1 --directory public >/tmp/endurance-manager-compat.log 2>&1 &
          echo $! >/tmp/endurance-manager-compat.pid
          for i in {1..20}; do
            if curl --fail --silent --show-error --max-time 2 "http://127.0.0.1:8788/" >/dev/null; then
              echo "Local exact-commit build is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/endurance-manager-compat.log || true
          exit 1
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run compatibility tests against exact commit
        run: npm run compat:test
        env:
          COMPAT_BASE_URL: ${{ env.COMPAT_BASE_URL }}
          COMPAT_REMOTE_BASE_URL: ${{ env.COMPAT_REMOTE_BASE_URL }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-compatibility-report-${{ github.ref_name }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

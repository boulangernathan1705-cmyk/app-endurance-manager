name: Browser compatibility

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  browser-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPAT_BASE_URL: https://app.endurance-manager.workers.dev
      ENV_LABEL: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Wait for deployment
        run: |
          echo "Checking ${ENV_LABEL}: ${COMPAT_BASE_URL}"
          for i in {1..18}; do
            if curl --fail --silent --show-error --max-time 10 \
              "${COMPAT_BASE_URL}/api/session" | grep -q '"discordReady"'; then
              exit 0
            fi
            sleep 10
          done
          curl --silent --output /dev/null --max-time 10 \
            --write-out 'status=%{http_code} type=%{content_type}\n' "${COMPAT_BASE_URL}/api/session"
          echo "::error::${COMPAT_BASE_URL}/api/session did not answer with the API (site down or protected by a login page)."
          exit 1
      - run: npm run compat:test
        env:
          COMPAT_BASE_URL: ${{ env.COMPAT_BASE_URL }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-compatibility-report-${{ github.ref_name }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

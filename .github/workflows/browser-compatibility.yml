name: Browser compatibility

# The site runs on the GitHub machine itself (wrangler dev, local database with every migration): nothing depends
# on a deployed site (the Cloudflare bot protection of endurance-manager.app answers 403 to GitHub's machines).
on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  browser-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPAT_BASE_URL: http://localhost:8787
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build:workers
      - name: Local database with every migration
        run: npx --yes wrangler@4.138.0 d1 migrations apply DB --local
      - name: Start the site locally
        run: |
          npx --yes wrangler@4.138.0 dev --port 8787 --var APP_ORIGIN:http://localhost:8787 \
            --var DISCORD_CLIENT_ID:ci --var DISCORD_CLIENT_SECRET:ci > wrangler-dev.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent --max-time 5 "${COMPAT_BASE_URL}/api/session" | grep -q '"discordReady"'; then exit 0; fi
            sleep 2
          done
          cat wrangler-dev.log
          echo "::error::the local site did not start"
          exit 1
      - run: npm run compat:test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-compatibility-report-${{ github.ref_name }}
          path: |
            playwright-report/
            test-results/
            wrangler-dev.log
          if-no-files-found: ignore
          retention-days: 7

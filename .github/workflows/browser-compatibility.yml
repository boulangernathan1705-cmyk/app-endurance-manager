name: Browser compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  browser-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Wait for production deployment
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 https://app.endurance-manager.workers.dev/api/session >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - run: npm run compat:test
        env:
          COMPAT_BASE_URL: https://app.endurance-manager.workers.dev
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-compatibility-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

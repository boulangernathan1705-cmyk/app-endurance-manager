name: Browser compatibility

# The site runs on the GitHub machine itself (wrangler dev, local database with every migration): nothing depends
# on a deployed site (the Cloudflare bot protection of endurance-manager.app answers 403 to GitHub's machines).
# Also on every PR into dev or main, so a browser regression is seen before it is merged (audit R15).
on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# A new push to the same PR stops the run that is now out of date.
concurrency:
  group: browser-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The browsers run side by side on four machines (about 5 min instead of 13 to 18 min on one machine).
  browsers:
    name: navigateur (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            install: chromium
            projects: --project=chromium-desktop --project=android-chrome
            visual: true
          - name: firefox
            install: firefox
            projects: --project=firefox-desktop --project=firefox-mobile-viewport
          - name: safari-desktop
            install: webkit
            projects: --project=webkit-desktop
          - name: iphone
            install: webkit
            projects: --project=iphone-safari
    # Playwright 1.55 is pinned in package-lock.json and does not support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPAT_BASE_URL: http://localhost:8787
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.install }}
      # The local site is served over http: Safari (unlike Chrome) applies upgrade-insecure-requests to localhost too.
      - run: npm run build:workers
        env:
          LOCAL_HTTP: '1'
      - name: Local database with every migration
        run: npx --yes wrangler@4.138.0 d1 migrations apply DB --local
      - name: Start the site locally
        run: |
          LOCAL_HTTP=1 npx --yes wrangler@4.138.0 dev --port 8787 --var APP_ORIGIN:http://localhost:8787 \
            --var DISCORD_CLIENT_ID:ci --var DISCORD_CLIENT_SECRET:ci > wrangler-dev.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent --max-time 5 "${COMPAT_BASE_URL}/api/session" | grep -q '"discordReady"'; then exit 0; fi
            sleep 2
          done
          cat wrangler-dev.log
          echo "::error::the local site did not start"
          exit 1
      - run: npm run compat:test -- ${{ matrix.projects }}
      # The « Charte »: the reference pages compared with their captures (tests/visual/__screenshots__).
      - if: matrix.visual
        run: npm run visual:test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-compatibility-report-${{ matrix.name }}-${{ github.run_id }}
          path: |
            playwright-report/
            playwright-visual-report/
            test-results/
            wrangler-dev.log
          if-no-files-found: ignore
          retention-days: 7

  # The check required on main keeps its name: green only when every browser is green.
  browser-compatibility:
    needs: browsers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.browsers.result != 'success'
        run: |
          echo "::error::a browser failed (${{ needs.browsers.result }})"
          exit 1
      - run: echo "Every browser passed."

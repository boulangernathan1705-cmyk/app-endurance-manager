name: Import verified LMU card covers
on:
  push:
    branches: [feat/lmu-card-covers]
    paths: [.github/workflows/temp-import-lmu-artwork.yml]
permissions:
  actions: read
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPAT_BASE_URL: http://localhost:8787
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Recover exact previously downloaded files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/lmu-art"
          gh run download 45672812743 -n lmu-card-covers -D "$RUNNER_TEMP/lmu-art/covers"
      - name: Optimize and wire the circuit thumbnails
        run: |
          python3 -m venv "$RUNNER_TEMP/art-venv"
          "$RUNNER_TEMP/art-venv/bin/pip" install Pillow==11.3.0
          "$RUNNER_TEMP/art-venv/bin/python" - <<'PY'
          import os, pathlib
          from PIL import Image, ImageOps
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'lmu-art'
          dest=pathlib.Path('images/endurance/lmu')
          dest.mkdir(parents=True,exist_ok=True)
          groups={'covers':'paul-ricard portimao bahrain monza spa fuji sebring imola cota lusail silverstone le-mans interlagos barcelona daytona laguna-seca road-atlanta long-beach'}
          ids=sorted(' '.join(groups.values()).split())
          assert len(ids)==len(set(ids))==18
          total=0
          for group,names in groups.items():
              for name in names.split():
                  matches=list((root/group).rglob(name+'.webp'))
                  assert len(matches)==1,(group,name,matches)
                  with Image.open(matches[0]) as original:
                      assert original.format=='WEBP'
                      im=ImageOps.exif_transpose(original).convert('RGB')
                      im.thumbnail((1280,1280),Image.Resampling.LANCZOS)
                      output=dest/(name+'.webp')
                      for quality in (82,76,70,64,58):
                          im.save(output,'WEBP',quality=quality,method=6)
                          if output.stat().st_size<=180000: break
                      while output.stat().st_size>180000 and im.width>640:
                          im.thumbnail((int(im.width*.85),int(im.height*.85)),Image.Resampling.LANCZOS)
                          im.save(output,'WEBP',quality=65,method=6)
                      assert output.stat().st_size<=180000,(name,im.size,output.stat().st_size)
                      assert im.width>=250 and im.height>=250,(name,im.size)
                      total+=output.stat().st_size
                      print(name,im.size,output.stat().st_size)
          print('18 local images, total bytes:',total)
          from PIL import ImageDraw
          sheet=Image.new('RGB',(960,960),'#151b20')
          draw=ImageDraw.Draw(sheet)
          for index,name in enumerate(ids):
              x=(index%6)*160; y=(index//6)*320
              with Image.open(dest/(name+'.webp')) as im:
                  im.thumbnail((150,285),Image.Resampling.LANCZOS)
                  sheet.paste(im,(x+(160-im.width)//2,y+20+(285-im.height)//2))
              draw.text((x+4,y+4),name,fill='white')
          sheet.save(pathlib.Path(os.environ['RUNNER_TEMP'])/'lmu-covers-review.png')
          def change(path,old,new):
              p=pathlib.Path(path)
              s=p.read_text()
              assert old in s,(path,old)
              p.write_text(s.replace(old,new,1))
          p=pathlib.Path('front/endurance-card.mjs')
          s=p.read_text()
          s=s.replace("export function enduranceHeader(event, game) {","const LMU_ARTWORK = new Set(["+','.join(repr(i) for i in ids)+"]);\nexport function enduranceArtworkClass(event, game) {\n  return enduranceSim(event, game) === 'lmu' && LMU_ARTWORK.has(event?.circuit) ? ' endurance-track-'+event.circuit : '';\n}\nexport function enduranceHeader(event, game) {",1)
          s=s.replace('endurance-sim-\x24{sim}"><span class="endurance-card-caption"','endurance-sim-\x24{sim}\x24{enduranceArtworkClass(event, game)}"><span class="endurance-card-caption"',1)
          assert 'enduranceArtworkClass(event, game)}' in s
          p.write_text(s)
          p=pathlib.Path('styles/pages/endurance-cards.css')
          s=p.read_text().replace('/* Endurance artwork: two local captures, no per-circuit mapping or network calls. */','/* Local circuit images for LMU, simulator images as fallback. */')
          s+='\n/* LMU Assister covers, optimized and served locally. */\n'
          s+='\n'.join('.endurance-card-head.endurance-track-'+i+" { --endurance-photo: url('/images/endurance/lmu/"+i+".webp'); }" for i in ids)+'\n'
          s+='\n.endurance-card-head[class*="endurance-track-"]::before { background-position: center; }\n' 
          p.write_text(s)
          p=pathlib.Path('scripts/validate-image-assets.mjs')
          with p.open('a') as f:
              f.write('\nfor (const circuit of ['+','.join(repr(i) for i in ids)+']) await validateWebp(\x60images/endurance/lmu/\x24{circuit}.webp\x60,{minWidth:250,minHeight:250,maxBytes:180000});\n')
          change('tests/compat/home-dashboard.spec.mjs',"  expect(await art.evaluate(el=>getComputedStyle(el,'::before').backgroundImage)).toContain('/images/endurance/'+sim+'.webp');","  const artwork=sim==='lmu'?'/images/endurance/lmu/spa.webp':'/images/endurance/iracing.webp';\n  expect(await art.evaluate(el=>getComputedStyle(el,'::before').backgroundImage)).toContain(artwork);")
          change('tests/compat/home-dashboard.spec.mjs',"page.evaluate(async sim=>{\n   const image=new Image();image.src='/images/endurance/'+sim+'.webp';","page.evaluate(async artwork=>{\n   const image=new Image();image.src=artwork;")
          change('tests/compat/home-dashboard.spec.mjs',"  },sim)).toBe(true);","  },artwork)).toBe(true);")
          change('tests/compat/home-dashboard.spec.mjs','image.naturalWidth>=400','image.naturalWidth>=250')
          change('tests/visual/pages.spec.mjs',".toContain('/images/endurance/'+game+'.webp');",".toContain(game==='lmu'?'/images/endurance/lmu/cota.webp':'/images/endurance/iracing.webp');")
          p=pathlib.Path('tests/endurance-card.test.mjs')
          s=p.read_text().replace('enduranceDuration,enduranceHeader','enduranceDuration,enduranceHeader,enduranceArtworkClass')
          s+="\nimport {GAME_CATALOGS} from '../shared/catalog.mjs';\nimport {existsSync} from 'node:fs';\ntest('all named LMU circuits have local artwork; other games and unknown circuits keep their fallback',()=>{\n for(const c of GAME_CATALOGS.lmu.circuits.filter(c=>!c.random&&!c.id.endsWith('-tbd'))){\n  assert.equal(enduranceArtworkClass({circuit:c.id},'lmu'),' endurance-track-'+c.id);\n  assert.ok(existsSync(new URL('../images/endurance/lmu/'+c.id+'.webp',import.meta.url)));\n }\n assert.equal(enduranceArtworkClass({circuit:'spa'},'iracing'),'');\n assert.equal(enduranceArtworkClass({circuit:'random'},'lmu'),'');\n});\n"
          p.write_text(s)
          p=pathlib.Path('images/endurance/SOURCES.md')
          s=p.read_text()
          s+='\n## LMU circuit covers\n\n18 previously downloaded public LMU Assister covers, optimized to WebP (max 1280 x 1280, 180 kB each). No runtime requests to the source. Rights remain with their owners; availability does not imply permission to republish. Verify usage rights before production.\n\n'
          for group,names in groups.items():
              report=list((root/group).rglob('report.txt'))
              assert len(report)==1,group
              for name in names.split():
                  lines=[l for l in report[0].read_text().splitlines() if l.startswith('OK ') and (l.startswith('OK '+name+' ') or group=='long-beach')]
                  assert len(lines)==1,(group,name,lines)
                  url=lines[0].split()[-1]
                  assert url.startswith('https://assets.lmu-assister.com/tracks/covers/')
                  s+='- '+name+': '+url+'\n'
          p.write_text(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lmu-covers-review
          path: ${{ runner.temp }}/lmu-covers-review.png
          retention-days: 7
      - run: npm ci
      - run: npm run check
      - name: Commit artwork and tests to the isolated branch
        run: |
          git rm .github/workflows/temp-import-lmu-artwork.yml
          git add images/endurance front/endurance-card.mjs styles/pages/endurance-cards.css scripts/validate-image-assets.mjs tests/endurance-card.test.mjs tests/compat/home-dashboard.spec.mjs tests/visual/pages.spec.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Endurance LMU : miniatures cover originales par circuit"
          git pull --rebase
          git push
      - run: npx playwright install --with-deps chromium
      - run: npm run build:workers
        env:
          LOCAL_HTTP: '1'
      - run: npx --yes wrangler@4.138.0 d1 migrations apply DB --local
      - name: Start the site locally
        run: |
          LOCAL_HTTP=1 npx --yes wrangler@4.138.0 dev --port 8787 --var APP_ORIGIN:http://localhost:8787 --var DISCORD_CLIENT_ID:ci --var DISCORD_CLIENT_SECRET:ci > wrangler-dev.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent --max-time 5 "$COMPAT_BASE_URL/api/session" | grep -q '"discordReady"'; then exit 0; fi
            sleep 2
          done
          cat wrangler-dev.log
          exit 1
      - run: npm run visual:update
      - name: Commit visual baselines
        run: |
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Références visuelles des circuits LMU mises à jour"
          git push

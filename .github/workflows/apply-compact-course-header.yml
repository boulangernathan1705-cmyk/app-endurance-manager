name: Apply compact course header
on:
  push:
    branches: [refine/course-header-mobile]
    paths: ['.github/workflows/apply-compact-course-header.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/course-header-mobile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply changes
        run: python3 scripts/refine-course-header.py
      - name: Run checks
        run: npm run check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles/application.css index.html
          git commit -m "refine: compact event header and recap"
          git push

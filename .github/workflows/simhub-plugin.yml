name: Plugin SimHub

# Compile le plugin SimHub sur une machine Windows de GitHub, sans SimHub : la façade de son API
# (connectors/simhub-plugin/reference) remplace ses DLL, avec les mêmes signatures (vérifiées par ApiCheck). Puis rejoue
# les séances de tests/Replay/fixtures dans le code du plugin, du jeu jusqu'au mur des stands dans SimHub. La DLL
# compilée est jointe à chaque exécution (Artifacts), prête à essayer.
on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths: ['connectors/simhub-plugin/**', 'shared/live.mjs', '.github/workflows/simhub-plugin.yml']
  pull_request:
    paths: ['connectors/simhub-plugin/**', 'shared/live.mjs', '.github/workflows/simhub-plugin.yml']

permissions:
  contents: read

concurrency:
  group: simhub-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    name: compilation et rejeu
    runs-on: windows-latest
    timeout-minutes: 20
    # Write: the pictures of the plugin's screen go back on the pull request's branch (step « Ranger les photos »).
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: connectors/simhub-plugin
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      REPLAY_OUT: ${{ github.workspace }}\replay-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Compiler le plugin (façade SimHub)
        run: dotnet build EnduranceManager.SimHub.csproj -c Release -p:UseSimHubFacade=true

      - name: Vérifier l'API SimHub utilisée
        run: dotnet run --project reference/ApiCheck -c Release -- bin/Release/EnduranceManager.SimHub.dll

      - name: Rejouer les séances (moteur .NET Framework 4.8, celui de SimHub)
        run: dotnet run --project tests/Replay -c Release -f net48

      - name: Photos de l'écran du plugin (guide et onglets, thème du site)
        run: dotnet run --project tests/Preview -c Release -- "$env:GITHUB_WORKSPACE\apercus"

      - name: Joindre les photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apercus-${{ github.sha }}
          path: apercus/*.png
          if-no-files-found: ignore

      # The pictures on the pull request's branch (tests/Preview/apercus), to look at without SimHub. [skip ci]: the
      # commit starts no new run.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.head_ref }}
          path: branche
      - name: Ranger les photos sur la branche
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: branche
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $to = "connectors/simhub-plugin/tests/Preview/apercus"
          New-Item -ItemType Directory -Force $to | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\apercus\*.png" $to -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $to
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "Photos inchangées."; exit 0 }
          git commit -m "Plugin : photos de l'écran (guide et onglets) [skip ci]"
          git push origin "HEAD:refs/heads/$env:HEAD_REF"

      - name: Résumé
        if: always()
        run: |
          $version = ([xml](Get-Content EnduranceManager.SimHub.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "### Plugin $version" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "DLL compilée sans SimHub : fichier « plugin-simhub-$version » dans Artifacts, plus bas sur cette page." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Joindre la DLL
        uses: actions/upload-artifact@v4
        with:
          name: plugin-simhub-${{ env.VERSION }}-${{ github.sha }}
          path: |
            connectors/simhub-plugin/bin/Release/EnduranceManager.SimHub.dll
            connectors/simhub-plugin/bin/Release/Installer le plugin.cmd
          if-no-files-found: error
          retention-days: 30

      - name: Joindre les chiffres rejoués (dash, mur, séances)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejeu-${{ github.sha }}
          path: |
            replay-out/*.mur.json
            replay-out/*.dash.json
            replay-out/*.sessions.json
          if-no-files-found: ignore
          retention-days: 14

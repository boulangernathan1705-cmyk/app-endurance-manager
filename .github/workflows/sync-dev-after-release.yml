name: Sync dev after release

# A release is squashed into main (ruleset « Protect production »), so dev no longer contains main afterwards and
# the next release PR would be refused (« strict » status checks). This brings main back into dev by a merge commit,
# the step done by hand until now (« Synchronisation avec main après vX »).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge main into dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "dev already contains main: nothing to do."
            exit 0
          fi
          version=$(git log -1 --format=%s origin/main | grep -oE '^v[0-9]+(\.[0-9]+)+' || true)
          if ! git merge --no-ff origin/main -m "Synchronisation avec main après ${version:-la release}"; then
            echo "::error::main and dev changed the same lines: merge main into dev by hand."
            exit 1
          fi
          git push origin HEAD:dev

name: LMU Assister catalog review
on:
  push:
    branches: [temp/lmu-thumbnail-recovery]
    paths: [.github/workflows/temp-lmu-assister-catalog.yml]
permissions: {}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public track catalog and download listed assets
        shell: bash
        run: |
          mkdir -p review/backgrounds review/covers
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, re, html, pathlib, concurrent.futures
          from html.parser import HTMLParser
          root=pathlib.Path('review')
          report=[]
          def get(url, limit=20_000_000):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'EnduranceManager-ImageReview/1.0'}),timeout=15) as r:
                  data=r.read(limit+1)
                  if len(data)>limit: raise ValueError('response too large')
                  return data
          assets={}
          def add(url, kind=None, title=None):
              if not isinstance(url,str): return
              url=html.unescape(url)
              p=urllib.parse.urlsplit(url)
              if p.scheme!='https' or p.hostname!='assets.lmu-assister.com' or not p.path.startswith('/tracks/'): return
              if kind not in ('backgrounds','covers'):
                  kind='backgrounds' if '/backgrounds/' in p.path else 'covers' if '/covers/' in p.path else None
              if kind and p.path.endswith(('.webp','.png','.jpg','.jpeg')):
                  assets[url]=(kind,title)
          def parse_page(url):
              try:
                  text=get(url,5_000_000).decode()
                  report.append('PAGE OK '+url)
                  for u in re.findall(r'https://assets\.lmu-assister\.com/tracks/[^\s"<>\x27),]+',html.unescape(text)):
                      add(u)
                  return text
              except Exception as e:
                  report.append('PAGE FAIL '+url+' '+str(e))
                  return ''
          try:
              boot=json.loads(get('https://lmu-assister.com/bootstrap',500000))
              base=boot['api_base_url'].rstrip('/')
              p=urllib.parse.urlsplit(base)
              if p.scheme!='https' or not (p.hostname=='lmu-assister.com' or p.hostname.endswith('.lmu-assister.com')):
                  raise ValueError('unexpected API host')
              api=re.sub(r'/api/v\d+$','',base)+'/api/v3/tracks'
              catalog=json.loads(get(api,5000000))
              rows=catalog.get('tracks',[])
              report.append('PUBLIC CATALOG entries '+str(len(rows)))
              for row in rows:
                  a=row.get('assets') or {}
                  for key in ('background','cover'):
                      add(a.get(key),key+'s',row.get('display_name') or row.get('name'))
              (root/'catalog.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          except Exception as e:
              report.append('PUBLIC CATALOG unavailable: '+str(e))
          home=parse_page('https://lmu-assister.com/')
          urls=set()
          for u in re.findall(r'https://web\.lmu-assister\.com/client/(?:tracks|schedule|events)/[^\s"<>\x27?#]+',html.unescape(home)):
              urls.add(u)
          for u in sorted(urls)[:25]:
              parse_page(u)
          for slug in ['4-hours-of-castellet-paul-ricard-circuit','6-hours-of-portimao-algarve-international-circuit','8-hours-of-bahrain-bahrain-international-circuit','6-hours-of-monza-autodromo-nazionale-monza']:
              add('https://assets.lmu-assister.com/tracks/backgrounds/'+slug+'.webp')
          def save(item):
              url,(kind,title)=item
              name=pathlib.PurePosixPath(urllib.parse.urlsplit(url).path).name
              try:
                  data=get(url)
                  if not (data.startswith(b'\x89PNG\r\n\x1a\n') or data.startswith(b'\xff\xd8\xff') or (data[:4]==b'RIFF' and data[8:12]==b'WEBP')):
                      raise ValueError('not an image')
                  (root/kind/name).write_bytes(data)
                  return 'OK '+kind+'/'+name+' '+str(len(data))+' '+str(title)+' '+url
              except Exception as e: return 'FAIL '+url+' '+str(e)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              report.extend(pool.map(save,sorted(assets.items())))
          (root/'report.txt').write_text('\n'.join(report))
          print('\n'.join(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lmu-assister-catalog
          path: review/
          retention-days: 1

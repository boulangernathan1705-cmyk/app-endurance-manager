name: Apply banner optimization

on:
  push:
    branches: [refactor/cloudflare-delivery-optimization]
    paths: ['.github/workflows/banner-optimization-preview.yml']

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cloudflare-delivery-optimization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Recompress active banner
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('images/endurance-manager-banner.webp')
          before = source.stat().st_size
          image = Image.open(source).convert('RGB')
          if image.size != (2048, 512):
              raise SystemExit(f'Unexpected banner dimensions: {image.size}')
          image.save(source, 'WEBP', quality=82, method=6)
          after = source.stat().st_size
          print(f'banner: {before} -> {after} bytes ({100 * (1-after/before):.1f}% smaller)')
          PY
      - name: Commit optimized binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/endurance-manager-banner.webp
          git diff --cached --quiet && exit 0
          git commit -m "Optimise la bannière principale"
          git push origin HEAD:refactor/cloudflare-delivery-optimization

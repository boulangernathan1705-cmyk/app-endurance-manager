name: Apply D1 migration 0013
on:
  push:
    branches: [feature/shared-pilot-category-controls]
    paths:
      - .github/workflows/apply-d1-migration-0013.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-pilot-category-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remove temporary migration workflow
        run: |
          rm .github/workflows/apply-d1-migration-0013.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: remove temporary D1 migration workflow"
          git push origin HEAD:feature/shared-pilot-category-controls

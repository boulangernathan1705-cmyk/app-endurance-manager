name: Apply shared catalog refactor

on:
  push:
    branches: ['refactor/codebase-cleanup']
    paths:
      - 'scripts/refactor-shared-catalog.mjs'
      - '.github/workflows/refactor-shared-catalog.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/codebase-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply deterministic refactor
        run: node scripts/refactor-shared-catalog.mjs
      - name: Run tests
        run: npm test
      - name: Verify worker build
        run: npm run build:workers
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: centralize shared race catalog"
          git push origin HEAD:refactor/codebase-cleanup

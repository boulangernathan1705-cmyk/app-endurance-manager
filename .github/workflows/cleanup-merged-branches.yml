name: Cleanup old branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every branch except main and dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          deleted=0
          kept=0

          while IFS= read -r ref; do
            branch="${ref#origin/}"

            case "$branch" in
              main|dev|HEAD)
                echo "Keeping protected branch: $branch"
                kept=$((kept + 1))
                continue
                ;;
            esac

            echo "Deleting old branch: $branch"
            git push origin --delete "$branch"
            deleted=$((deleted + 1))
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | sort)

          echo "Deleted: $deleted"
          echo "Kept: $kept"

name: Apply logo and crew availability fix
on:
  push:
    branches:
      - fix/logo-and-crew-availability
    paths:
      - scripts/apply-logo-availability-fix.py
      - .github/workflows/apply-logo-availability-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/logo-and-crew-availability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply changes
        run: python3 scripts/apply-logo-availability-fix.py
      - name: Run checks
        run: npm run check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles/brand-theme.css styles/application.css index.html
          git commit -m "fix: improve header logo and show crew availability"
          git push

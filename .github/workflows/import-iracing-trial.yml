name: Import licensed iRacing trial photos
on:
  pull_request:
    types: [synchronize]
    branches: [dev]
    paths:
      - '.github/workflows/import-iracing-trial.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.event.pull_request.number == 883 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/iracing-artwork-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iracing-artwork-isolation
      - name: Download the three explicitly licensed originals and optimize locally
        shell: bash
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from io import BytesIO
          from PIL import Image, ImageOps
          sources = {
              'iracing-spa': ('https://upload.wikimedia.org/wikipedia/commons/7/7c/Eau_Rouge_at_Spa_Francorchamps.jpg', (0.34, 0.42)),
              'iracing-bathurst': ('https://upload.wikimedia.org/wikipedia/commons/e/ed/Citigate_Mount_Panorama_Bathurst_%28down_the_mountain%29_-_panoramio.jpg', (0.60, 0.68)),
              'iracing-laguna-seca': ('https://upload.wikimedia.org/wikipedia/commons/7/70/Laguna_Seca%27s_Corkscrew_-_2014_%282%29.jpg', (0.49, 0.46)),
          }
          for track, (url, focus) in sources.items():
              req = Request(url, headers={'User-Agent': 'EnduranceManager/1.0 (licensed Wikimedia Commons artwork for endurance-manager.app)'})
              with urlopen(req, timeout=30) as resp:
                  raw = resp.read(15_000_001)
              if len(raw) > 15_000_000:
                  raise ValueError('original too large')
              with Image.open(BytesIO(raw)) as img:
                  im = ImageOps.exif_transpose(img).convert('RGB')
              for directory, size in [('iracing', (640,640)), ('iracing-pano', (1280,720))]:
                  target = Path('images/endurance') / directory / (track + '.webp')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  crop = ImageOps.fit(im, size, Image.Resampling.LANCZOS, centering=focus)
                  for quality in (82,76,70,64,58,52):
                      crop.save(target, 'WEBP', quality=quality, method=6)
                      if target.stat().st_size <= 180000:
                          break
                  else:
                      raise ValueError('WebP too large: ' + str(target))
                  print(target, crop.size, target.stat().st_size)
          PY
      - name: Commit the six trial files only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/endurance/iracing/iracing-{spa,bathurst,laguna-seca}.webp images/endurance/iracing-pano/iracing-{spa,bathurst,laguna-seca}.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add six licensed iRacing trial WebP assets"
          git push origin HEAD:fix/iracing-artwork-isolation

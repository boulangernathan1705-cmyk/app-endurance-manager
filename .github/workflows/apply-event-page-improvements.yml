name: Apply event page improvements
on:
  push:
    branches:
      - feature/event-page-status-hours
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-page-status-hours
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply deterministic changes
        run: node scripts/apply-event-page-improvements.mjs
      - name: Run checks
        run: npm run check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles/foundation.css tests/interface.test.mjs scripts/apply-event-page-improvements.mjs .github/workflows/apply-event-page-improvements.yml
          git commit -m "feat: improve event status and race hour display"
          git push

name: Apply registration pilot flow
on:
  push:
    branches: [feature/registration-pilot-flow]
    paths:
      - scripts/apply-registration-pilot-flow.mjs
      - .github/workflows/apply-registration-pilot-flow.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/registration-pilot-flow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Adapt temporary patch to current shared timeline files
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='scripts/apply-registration-pilot-flow.mjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace("`@import url('/styles/registration-density.css');`,\n`@import url('/styles/registration-density.css');\\n@import url('/styles/registration-context.css');`", "`@import url('/styles/timeline.css');`,\n`@import url('/styles/timeline.css');\\n@import url('/styles/registration-context.css');`");
          s=s.replace("`<link rel=\"stylesheet\" href=\"/styles.css?v=29-availability-timeline\">`,\n`<link rel=\"stylesheet\" href=\"/styles.css?v=30-registration-pilot-flow\">`", "`<link rel=\"stylesheet\" href=\"/styles.css?v=30-shared-timeline\">`,\n`<link rel=\"stylesheet\" href=\"/styles.css?v=31-registration-pilot-flow\">`");
          s=s.replace("`<script type=\"module\" src=\"/app.js?v=22-availability-timeline\"></script>`,\n`<script type=\"module\" src=\"/app.js?v=23-registration-pilot-flow\"></script>`", "`<script type=\"module\" src=\"/app.js?v=22-shared-timeline\"></script>`,\n`<script type=\"module\" src=\"/app.js?v=23-registration-pilot-flow\"></script>`");
          fs.writeFileSync(p,s);
          NODE
      - run: node scripts/apply-registration-pilot-flow.mjs
      - run: npm run check
      - name: Commit patch and remove temporary automation
        run: |
          rm scripts/apply-registration-pilot-flow.mjs
          rm .github/workflows/apply-registration-pilot-flow.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: clarify managed pilot registrations"
          git push origin HEAD:feature/registration-pilot-flow

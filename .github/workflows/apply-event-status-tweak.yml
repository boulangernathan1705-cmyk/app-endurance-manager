name: Apply event status tweak
on:
  push:
    branches: [feature/event-page-status-hours]
    paths:
      - 'scripts/apply-event-status-tweak.mjs'
      - '.github/workflows/apply-event-status-tweak.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply changes
        run: node scripts/apply-event-status-tweak.mjs
      - name: Run checks
        run: npm run check
      - name: Commit changes
        run: |
          rm scripts/apply-event-status-tweak.mjs .github/workflows/apply-event-status-tweak.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: simplify running event status' || exit 0
          git push

name: Apply my entries course-style accordion
on:
  push:
    branches: [refine/my-entries-accordion]
    paths: ['.github/workflows/apply-my-entries-course-accordion.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine/my-entries-accordion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply changes
        run: python3 scripts/refine-my-entries-accordion.py
      - name: Run checks
        run: npm run check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles/application.css index.html
          git commit -m "refine: align my entries accordion with course"
          git push

name: Apply front CSS refactor

on:
  push:
    branches:
      - refactor/codebase-cleanup
    paths:
      - scripts/refactor-front-css.mjs
      - .github/workflows/refactor-front-css.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/codebase-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply deterministic front refactor
        run: node scripts/refactor-front-css.mjs
      - name: Run full checks
        run: npm run check
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: modularize front schedule and css"
          git push

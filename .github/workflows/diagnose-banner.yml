name: Diagnose banner
on:
  push:
    branches:
      - fix/banner-hq-source
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect banner asset
        run: |
          ls -lh images/endurance-manager-banner-final.webp images/endurance-manager-banner.webp
          file images/endurance-manager-banner-final.webp images/endurance-manager-banner.webp
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          for path in ['images/endurance-manager-banner-final.webp','images/endurance-manager-banner.webp']:
              try:
                  im=Image.open(path)
                  im.verify()
                  im=Image.open(path)
                  print(path, im.size, im.mode, im.format)
              except Exception as exc:
                  print(path, 'INVALID', repr(exc))
                  raise
          PY
      - name: Build and verify public asset
        run: |
          npm run build:workers
          test -s public/images/endurance-manager-banner-final.webp
          cmp images/endurance-manager-banner-final.webp public/images/endurance-manager-banner-final.webp
          npm run check

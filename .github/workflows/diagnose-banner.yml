name: Repair and verify banner
on:
  push:
    branches:
      - fix/banner-hq-source
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/banner-hq-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair malformed WebP header
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('images/endurance-manager-banner-final.webp')
          target=Path('images/endurance-manager-banner-final-v2.webp')
          data=bytearray(source.read_bytes())
          marker=data.find(b'\x9d\x01\x2a')
          if marker < 0:
              raise SystemExit('VP8 frame marker not found')
          width=int.from_bytes(data[marker+3:marker+5],'little') & 0x3fff
          height=int.from_bytes(data[marker+5:marker+7],'little') & 0x3fff
          print('before', width, height, 'marker', marker)
          if width != 2048 or height != 0:
              raise SystemExit(f'Unexpected malformed dimensions: {width}x{height}')
          # VP8 stores the 14-bit frame height in little endian immediately after width.
          data[marker+5:marker+7]=(512).to_bytes(2,'little')
          target.write_bytes(data)
          print('wrote', target, len(data), 'bytes')
          PY
      - name: Decode and validate repaired banner
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          path='images/endurance-manager-banner-final-v2.webp'
          im=Image.open(path)
          im.verify()
          im=Image.open(path)
          print(path, im.size, im.mode, im.format)
          if im.size != (2048,512):
              raise SystemExit(f'Unexpected repaired size: {im.size}')
          PY
          file images/endurance-manager-banner-final-v2.webp
      - name: Verify complete build
        run: |
          npm run check
          npm run build:workers
          test -s public/images/endurance-manager-banner-final-v2.webp
          cmp images/endurance-manager-banner-final-v2.webp public/images/endurance-manager-banner-final-v2.webp
          grep -q 'endurance-manager-banner-final-v2.webp' public/index.html
      - name: Commit repaired asset and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/endurance-manager-banner-final-v2.webp index.html styles/banner-media.css
          git rm .github/workflows/diagnose-banner.yml
          git commit -m "fix: repair final banner asset and verify build"
          git push origin HEAD:fix/banner-hq-source

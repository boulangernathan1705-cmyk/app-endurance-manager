name: Help real screenshots

on:
  push:
    branches:
      - feature/help-real-screenshots
    paths:
      - scripts/capture-help-screenshots-v2.mjs
      - scripts/capture-help-crews.mjs
      - .github/workflows/help-screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/help-real-screenshots
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build current site
        run: npm run build

      - name: Capture real interface
        run: |
          python3 -m http.server 4173 -d public > /tmp/help-server.log 2>&1 &
          sleep 2
          node scripts/capture-help-screenshots-v2.mjs
          node scripts/capture-help-crews.mjs

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/help/*.jpg
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "Complète les captures réelles de l’interface pour l’aide"
            git push origin HEAD:feature/help-real-screenshots
          fi

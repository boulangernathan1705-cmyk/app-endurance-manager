name: Clean six verified historical Claude branches

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or delete only the six verified branches
        required: true
        type: choice
        default: preview
        options:
          - preview
          - delete
      confirmation:
        description: "Type DELETE_6_VERIFIED_BRANCHES to allow deletion"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch heads, ancestry, and open pull requests
        uses: actions/github-script@v7
        env:
          CLEANUP_MODE: ${{ inputs.mode }}
          CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const candidates = [
              ['claude/project-thread-9s5f96', 'ea939a07ebe133cba1a0d2b7e7f860ab1f7530a4'],
              ['claude/project-thread-45sfow', '424f789822cdc4fb3c7f3ff2ad1190a8c3d5aaac'],
              ['claude/project-thread-576zob', 'e30d0ee3b5365291e34f88388b448583008b3c9a'],
              ['claude/project-thread-buns8z', '0fa50dc946005e306b7b6e172755ce7fee137391'],
              ['claude/project-thread-d9cp4o', 'd34db73265c4bb4740855b2631665b70d49a579b'],
              ['claude/project-thread-niyep3', '9b4ab7ae91ff2b5fda3e0c8253a414c0e83e78a2'],
            ];
            const mode = process.env.CLEANUP_MODE || 'preview';
            if (mode !== 'preview' && mode !== 'delete') {
              core.setFailed('Invalid mode');
              return;
            }
            if (mode === 'delete' && process.env.CLEANUP_CONFIRMATION !== 'DELETE_6_VERIFIED_BRANCHES') {
              core.setFailed('Deletion requires exactly DELETE_6_VERIFIED_BRANCHES');
              return;
            }
            const {owner, repo} = context.repo;
            const open = await github.paginate(github.rest.pulls.list, {owner, repo, state:'open', per_page:100});
            let eligible = 0, deleted = 0, skipped = 0;
            for (const [branch, expectedSha] of candidates) {
              if (!branch.startsWith('claude/') || open.some(pr => pr.head.ref === branch && pr.head.repo?.full_name === `${owner}/${repo}`)) {
                core.warning(`SKIP ${branch}: protected or open PR`);
                skipped++;
                continue;
              }
              let current;
              try {
                current = await github.rest.git.getRef({owner, repo, ref:`heads/${branch}`});
              } catch(e) {
                if (e.status === 404) { core.info(`SKIP ${branch}: already gone`); skipped++; continue; }
                throw e;
              }
              if (current.data.object.sha !== expectedSha) {
                core.warning(`SKIP ${branch}: branch changed since audit`);
                skipped++;
                continue;
              }
              const compared = await github.rest.repos.compareCommits({owner, repo, base:branch, head:'dev'});
              if (compared.data.behind_by !== 0 || compared.data.status !== 'ahead') {
                core.warning(`SKIP ${branch}: not provably an ancestor of dev`);
                skipped++;
                continue;
              }
              eligible++;
              if (mode === 'preview') { core.notice(`PREVIEW: ${branch}`); continue; }
              const fresh = await github.rest.git.getRef({owner, repo, ref:`heads/${branch}`});
              if (fresh.data.object.sha !== expectedSha) { core.warning(`SKIP ${branch}: changed in the meantime`); skipped++; continue; }
              await github.rest.git.deleteRef({owner, repo, ref:`heads/${branch}`});
              deleted++;
              core.notice(`DELETED: ${branch}`);
            }
            core.summary.addHeading('Six historical branches');
            core.summary.addRaw(`Mode: ${mode}; eligible: ${eligible}; deleted: ${deleted}; skipped: ${skipped}`);
            await core.summary.write();
